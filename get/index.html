<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get VoxBox</title>
<meta name="description" content="VoxBox — AI Video & Audio Editor. Free on the App Store and Google Play.">
<meta property="og:title" content="VoxBox — AI Video & Audio Editor">
<meta property="og:description" content="Mix music, edit videos and create with AI. Free on iPhone and Android.">
<meta property="og:image" content="https://zazavoxbox.com/icon.jpg">
<link rel="icon" href="/icon.jpg">
<script>
// One link for every phone: iPhone/iPad -> App Store, Android -> Google Play,
// anything else stays on this page with both buttons. ?src=<name> is passed
// to Google Play as the install referrer (utm_source) so installs from a
// campaign show up in Play Console acquisition reports.
(function () {
  var ios = 'https://apps.apple.com/us/app/voxbox-ai-video-audio-editor/id6758082200';
  var play = 'https://play.google.com/store/apps/details?id=com.zaza.beatbox';
  var src = (new URLSearchParams(location.search).get('src') || '').replace(/[^a-z0-9_-]/gi, '').slice(0, 40);
  if (src) play += '&referrer=' + encodeURIComponent('utm_source=' + src + '&utm_medium=link');
  window.__stores = { ios: ios, play: play };
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  if (isIOS) location.replace(ios);
  else if (isAndroid) location.replace(play);
})();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: linear-gradient(160deg, #12152a, #2c1a4a); color: #fff;
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { margin: 16px 0 4px; font-size: 32px; }
  p { margin: 0 0 24px; color: #c9cde0; }
  .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn { display: inline-block; padding: 14px 22px; border-radius: 12px; background: #fff; color: #141826;
          font-weight: 700; text-decoration: none; min-width: 180px; }
</style>
</head>
<body>
  <main>
    <img src="/icon.jpg" alt="VoxBox app icon">
    <h1>VoxBox</h1>
    <p>AI Video &amp; Audio Editor — free on iPhone and Android</p>
    <div class="btns">
      <a class="btn" id="ios" href="https://apps.apple.com/us/app/voxbox-ai-video-audio-editor/id6758082200">App Store</a>
      <a class="btn" id="play" href="https://play.google.com/store/apps/details?id=com.zaza.beatbox">Google Play</a>
    </div>
  </main>
  <script>document.getElementById('play').href = window.__stores.play;</script>
</body>
</html>
